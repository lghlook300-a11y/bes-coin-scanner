name: BES Coin Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: bes-coin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan Upbit KRW markets
        run: python bes-coin-scanner-upload/scanner.py

      - name: Save result
        run: |
          if [ -z "$(git status --porcelain -- data/latest.json)" ]; then
            exit 0
          fi
          git config user.name "bes-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update BES coin signals"
          git push
