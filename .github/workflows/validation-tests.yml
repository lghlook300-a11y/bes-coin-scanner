name: Validate performance recording
on:
  pull_request:
    paths:
      - 'bes-coin-scanner-upload/scanner.py'
      - 'tests/**'
      - '.github/workflows/validation-tests.yml'
  push:
    branches: [main]
    paths:
      - 'bes-coin-scanner-upload/scanner.py'
      - 'tests/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
