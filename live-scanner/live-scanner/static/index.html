<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 실시간 후보 TOP 3</title>
<style>
    :root{color-scheme:dark;--bg:#06111d;--card:#0d1b2b;--line:#1e3850;--green:#39e6b0;--amber:#ffbd57;--red:#ff6b75;--text:#eff7ff;--muted:#8ca1b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}h1{font-size:25px;margin:6px 0}.sub{color:var(--muted);font-size:13px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.status{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green)}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.box,.coin,.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.box b{display:block;font-size:23px;margin-top:5px}.coin{margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.symbol{font-size:23px;font-weight:800}.action{padding:8px 11px;border-radius:10px;text-align:right;font-size:15px}.buy{color:var(--green);background:#103a32}.observe{color:#73c7ff;background:#17324a}.wait{color:var(--amber);background:#3b3018}.ban{color:var(--red);background:#3a1d27}.chart{height:76px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#081522;padding:6px}.chart svg{width:100%;height:100%;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px;font-size:13px}.grid span{color:var(--muted);display:block;margin-bottom:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions a{text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font-weight:700}.actions a:first-child{border-color:#1d755d;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:55px 15px;margin-top:12px}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:8px}.notice{margin:12px 0;color:var(--muted);font-size:12px}@media(max-width:450px){.summary{grid-template-columns:1fr 1fr}.summary .box:first-child{grid-column:1/-1}}
</style></head><body><main class="wrap">
<div class="head"><div><div class="status"><span id="dot" class="dot"></span><span id="connection">연결 확인 중</span></div><h1>실시간 수급 연구 TOP 3</h1><div class="sub">성과 검증 중이며 매수 신호를 제공하지 않습니다.</div></div></div>
<section class="summary"><div class="box">전체 감시<b id="markets">-</b></div><div class="box">관찰 후보<b id="candidates">-</b></div><div class="box">매수 신호<b id="buyReviews">0</b></div></section>
<div id="updated" class="sub"></div><div class="notice">검증 전용 화면입니다. 표시 종목은 매수 대상이 아닙니다.</div><section id="list"></section>
</main><script>
const fmt=n=>n==null?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:8}),actionClass=a=>a==='매수 검토'?'buy':a==='관찰'?'observe':a==='눌림 대기'?'wait':'ban';
const spark=(points,action)=>{if(!points||points.length<2)return '<div class="empty" style="padding:24px">차트 준비 중</div>';const ps=points.map(p=>Number(p[1])),lo=Math.min(...ps),hi=Math.max(...ps),range=hi-lo||1,w=300,h=60,pad=4,path=ps.map((p,i)=>`${i?'L':'M'}${pad+i*(w-pad*2)/(ps.length-1)},${h-pad-(p-lo)*(h-pad*2)/range}`).join(' '),color=action==='매수 검토'?'#39e6b0':action==='관찰'?'#73c7ff':action==='눌림 대기'?'#ffbd57':'#ff6b75';return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`},links=s=>({bithumb:`https://www.bithumb.com/trade/order/${encodeURIComponent(s)}_KRW`,tv:`https://www.tradingview.com/chart/?symbol=BITHUMB%3A${encodeURIComponent(s)}KRW`});
async function load(){try{const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());dot.classList.toggle('on',d.connected);connection.textContent=d.connected?'빗썸 실시간 연결':'연결 끊김';markets.textContent=d.market_count;candidates.textContent=d.candidate_count;buyReviews.textContent=0;updated.textContent=d.updated_at_ms?'마지막 반영 '+new Date(d.updated_at_ms).toLocaleTimeString():'데이터 준비 중';
list.innerHTML=d.results.length?d.results.map(x=>{const u=links(x.symbol);return `<article class="coin"><div class="top"><div><div class="symbol">${x.symbol}</div><div class="sub">${x.market} · ${x.score}점</div></div><b class="action ${actionClass(x.action)}">${x.action}<br><small>${x.state}</small></b></div><div class="chart">${spark(x.chart_prices,x.action)}</div><div class="grid"><div><span>현재가</span>${fmt(x.current_price)}</div><div><span>최초 포착가</span>${fmt(x.first_seen_price)}</div><div><span>포착 후 수익률</span>${fmt(x.return_since_first)}%</div><div><span>최고 / MAE</span>${fmt(x.peak_return)}% / ${fmt(x.mae)}%</div><div><span>30초 / 1분 수급</span>${x.flow_30s}배 / ${x.flow_1m}배</div><div><span>매수체결 비율</span>${x.buy_ratio_30s}%</div></div><div class="actions"><a href="${u.bithumb}" target="_blank" rel="noopener">빗썸 차트</a><a href="${u.tv}" target="_blank" rel="noopener">트레이딩뷰</a></div></article>`}).join(''):'<div class="empty"><b>현재 실시간 수급 후보 없음</b>수급 유입이 확인되면 TOP 3에 표시됩니다.</div>'}catch(e){connection.textContent='데이터 연결 오류'}}setInterval(load,1000);load();
</script></body></html>
