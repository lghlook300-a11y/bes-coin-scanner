<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 수급·A 복합 검색기</title>
<style>
    :root{color-scheme:dark;--bg:#06111d;--card:#0d1b2b;--line:#1e3850;--green:#39e6b0;--amber:#ffbd57;--red:#ff6b75;--text:#eff7ff;--muted:#8ca1b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}h1{font-size:25px;margin:6px 0}.sub{color:var(--muted);font-size:13px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.status{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green)}button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.box,.coin,.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.box b{display:block;font-size:23px;margin-top:5px}.coin{margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.symbol{font-size:23px;font-weight:800}.action{padding:8px 11px;border-radius:10px;text-align:right;font-size:15px}.buy{color:var(--green);background:#103a32}.observe{color:#73c7ff;background:#17324a}.wait{color:var(--amber);background:#3b3018}.ban{color:var(--red);background:#3a1d27}.chart{height:76px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#081522;padding:6px}.chart svg{width:100%;height:100%;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px;font-size:13px}.grid span{color:var(--muted);display:block;margin-bottom:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions a{text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font-weight:700}.actions a:first-child{border-color:#1d755d;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:55px 15px;margin-top:12px}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:8px}.notice{margin:12px 0;color:var(--muted);font-size:12px}@media(max-width:450px){.summary{grid-template-columns:1fr 1fr}.summary .box:first-child{grid-column:1/-1}}
</style></head><body><main class="wrap">
<div class="head"><div><div class="status"><span id="dot" class="dot"></span><span id="connection">연결 확인 중</span></div><h1>수급·A 복합 검색기</h1><div class="sub">기존 수급과 4시간봉 A+수급을 한 화면에서 따로 검증합니다.</div></div><button id="alarm">알림 켜기</button></div>
<section class="summary"><div class="box">전체 감시<b id="markets">-</b></div><div class="box">기존 수급<b id="champion">-</b></div><div class="box">A+수급<b id="challenger">-</b></div><div class="box">시도 가능<b id="buyReviews">-</b></div></section>
<div id="updated" class="sub"></div><div class="notice">A는 위치 확인입니다. A+수급 2회와 가격 방어가 함께 확인돼야 시도 가능으로 표시됩니다.</div><section id="list"></section>
</main><script>
const fmt=n=>n==null?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:8}),actionClass=a=>a==='돌파 확인'||a==='소액 시도 가능'?'buy':a==='매수 금지'?'ban':'wait';
const spark=(points,action)=>{if(!points||points.length<2)return '<div class="empty" style="padding:24px">차트 준비 중</div>';const ps=points.map(p=>Number(p[1])),lo=Math.min(...ps),hi=Math.max(...ps),range=hi-lo||1,w=300,h=60,pad=4,path=ps.map((p,i)=>`${i?'L':'M'}${pad+i*(w-pad*2)/(ps.length-1)},${h-pad-(p-lo)*(h-pad*2)/range}`).join(' '),color=action==='돌파 확인'||action==='소액 시도 가능'?'#39e6b0':action==='매수 금지'?'#ff6b75':'#ffbd57';return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`},links=s=>({bithumb:`https://www.bithumb.com/trade/order/${encodeURIComponent(s)}_KRW`,tv:`https://www.tradingview.com/chart/?symbol=BITHUMB%3A${encodeURIComponent(s)}KRW`});
let known=new Set(),initialized=false;alarm.onclick=async()=>{if(!('Notification'in window)){alarm.textContent='알림 미지원';return}const p=await Notification.requestPermission();alarm.textContent=p==='granted'?'알림 켜짐':'알림 차단됨'};
async function load(){try{const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());dot.classList.toggle('on',d.connected);connection.textContent=d.connected?'빗썸 실시간 연결':'연결 끊김';markets.textContent=d.market_count;champion.textContent=d.champion_count;challenger.textContent=d.challenger_count;buyReviews.textContent=d.buy_review_count;updated.textContent=d.updated_at_ms?'마지막 반영 '+new Date(d.updated_at_ms).toLocaleTimeString()+' · BTC '+(d.btc_market?.state||'확인 중'):'데이터 준비 중';const buyNow=d.results.filter(x=>x.action==='소액 시도 가능'||x.action==='돌파 확인');if(initialized&&'Notification'in window&&Notification.permission==='granted')buyNow.filter(x=>!known.has(x.market)).forEach(x=>new Notification(`BES ${x.action}: ${x.symbol}`,{body:`${x.detection_route} · 진입 ${fmt(x.entry_low)}~${fmt(x.entry_high)} · 손절 ${fmt(x.decision_stop_price)}`}));known=new Set(buyNow.map(x=>x.market));initialized=true;
list.innerHTML=d.results.length?d.results.map(x=>{const u=links(x.symbol);return `<article class="coin"><div class="top"><div><div class="symbol">${x.symbol}</div><div class="sub">${x.market} · ${x.score}점 · ${x.risk} · ${x.detection_route}</div></div><b class="action ${actionClass(x.action)}">${x.action}<br><small>${x.decision_reason}</small></b></div><div class="chart">${spark(x.chart_prices,x.action)}</div><div class="grid"><div><span>현재가</span>${fmt(x.current_price)}</div><div><span>현재 단계</span>${x.state} · ${x.flow_second_strength==null?'1차':'2차'}</div><div><span>오늘 재포착</span>${x.daily_detection_count}회 · ${x.daily_price_trend}</div><div><span>A / 2차 / 시도 가능</span>${x.daily_a_count}회 / ${x.daily_second_count}회 / ${x.daily_actionable_count}회</div><div><span>마지막 포착</span>${x.daily_last_seen_at_ms?new Date(x.daily_last_seen_at_ms).toLocaleTimeString():'-'}</div><div><span>포착가격 흐름</span>${(x.daily_detection_prices||[]).map(fmt).join(' → ')||'-'}</div><div><span>4H A 위치</span>${fmt(x.a_price)} (${fmt(x.a_distance_percent)}%)</div><div><span>A 판정</span>${x.a_reason}</div><div><span>진입 가능 구간</span>${fmt(x.entry_low)} ~ ${fmt(x.entry_high)}</div><div><span>무효화·손절 가격</span>${fmt(x.decision_stop_price)} (${fmt(x.stop_distance_percent)}%)</div><div><span>단기 돌파 기준</span>${fmt(x.breakout_price)}</div><div><span>최초 포착가</span>${fmt(x.first_seen_price)}</div><div><span>포착 후 수익률</span>${fmt(x.return_since_first)}%</div><div><span>최고 / MAE</span>${fmt(x.peak_return)}% / ${fmt(x.mae)}%</div><div><span>1차 / 2차 수급</span>${fmt(x.flow_first_strength)}배 / ${fmt(x.flow_second_strength)}배</div><div><span>30초 / 1분 수급</span>${x.flow_30s}배 / ${x.flow_1m}배</div><div><span>매수체결 비율</span>${x.buy_ratio_30s}% / 1분 ${x.buy_ratio_1m}%</div></div><div class="actions"><a href="${u.bithumb}" target="_blank" rel="noopener">빗썸 차트</a><a href="${u.tv}" target="_blank" rel="noopener">트레이딩뷰</a></div></article>`}).join(''):'<div class="empty"><b>현재 판정할 신호 없음</b>수급이 감지되면 자동으로 판정합니다.</div>'}catch(e){connection.textContent='데이터 연결 오류'}}setInterval(load,1000);load();
</script></body></html>
