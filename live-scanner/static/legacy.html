<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 15분 검색기</title><style>
:root{color-scheme:dark;--bg:#06111d;--card:#0d1b2b;--line:#1e3850;--green:#39e6b0;--amber:#ffbd57;--text:#eff7ff;--muted:#8ca1b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}h1{font-size:25px;margin:5px 0}.sub{font-size:13px;color:var(--muted)}.status{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.box,.coin,.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.box b{display:block;font-size:22px;margin-top:5px}.coin{margin:10px 0}.top{display:flex;justify-content:space-between;gap:8px}.symbol{font-size:22px;font-weight:800}.badge{color:var(--green);background:#103a32;border-radius:10px;padding:8px 10px;text-align:right}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px;font-size:13px}.grid span{display:block;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions a{padding:10px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:10px}.empty{text-align:center;color:var(--muted);padding:55px 15px}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:8px}@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><div class="status"><span class="dot"></span><span>Railway 15분 자동검사</span></div><h1>기존 15분 검색기</h1><div class="sub">GitHub 예약 실행 없이 Railway가 직접 검사합니다.</div><section class="summary"><div class="box">전체<b id="markets">-</b></div><div class="box">검사 완료<b id="scanned">-</b></div><div class="box">활성 신호<b id="active">-</b></div><div class="box">매수 검토<b id="actionable">-</b></div></section><div id="updated" class="sub"></div><section id="list"></section></main><script>
const fmt=n=>n==null?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:8}),link=s=>({b:`https://www.bithumb.com/trade/order/${encodeURIComponent(s)}_KRW`,t:`https://www.tradingview.com/chart/?symbol=BITHUMB%3A${encodeURIComponent(s)}KRW`});
async function load(){try{const d=await fetch('/api/legacy-state',{cache:'no-store'}).then(r=>r.json());markets.textContent=d.market_count||0;scanned.textContent=d.scanned_count||0;active.textContent=d.active_count||0;actionable.textContent=d.actionable_count||0;updated.textContent=d.updated_at?'마지막 검사 '+new Date(d.updated_at).toLocaleString():(d.status||'첫 검사 진행 중');const rows=d.candidates||[];list.innerHTML=rows.length?rows.map(x=>{const u=link(x.symbol);return `<article class="coin"><div class="top"><div><div class="symbol">${x.symbol}</div><div class="sub">${x.market} · ${x.watch_stage||x.stage||'관찰'}</div></div><b class="badge">${x.action||'관찰'}<br><small>${x.score||0}점</small></b></div><div class="grid"><div><span>현재가</span>${fmt(x.current_price)}</div><div><span>최초 포착가</span>${fmt(x.first_watch_price||x.first_detected_price)}</div><div><span>15분 / 1시간</span>${fmt(x.change_15m)}% / ${fmt(x.change_1h)}%</div><div><span>12시간</span>${fmt(x.change_12h)}%</div><div><span>포착 후 현재</span>${fmt(x.return_since_watch??x.return_since_detection)}%</div><div><span>최고 / MAE</span>${fmt(x.peak_return_since_watch??x.peak_return_since_detection)}% / ${fmt(x.mae_since_watch??x.mae_since_detection)}%</div></div><div class="actions"><a href="${u.b}" target="_blank">빗썸 차트</a><a href="${u.t}" target="_blank">트레이딩뷰</a></div></article>`}).join(''):`<div class="empty"><b>${d.status||'현재 상승 초입 후보 없음'}</b>다음 15분 검사에서 다시 확인합니다.</div>`}catch(e){updated.textContent='15분 검사 연결 오류'}}setInterval(load,5000);load();
</script></body></html>
