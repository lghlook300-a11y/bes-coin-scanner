<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BES 3단계 검색기</title>
<style>
:root{color-scheme:dark;--bg:#06111d;--card:#0d1b2b;--line:#203a51;--text:#f2f7fc;--muted:#91a6b9;--yellow:#ffd166;--orange:#ff9f43;--green:#3de0ad;--blue:#70c6ff;--red:#ff6b75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 15px 70px}header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green)}h1{margin:7px 0 5px;font-size:27px}.desc,.updated{color:var(--muted);font-size:13px}.alarm{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.sum{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:14px}.sum span{display:block;color:var(--muted);font-size:13px}.sum b{display:block;font-size:27px;margin-top:4px}.sum.yellow{border-color:#66572b}.sum.orange{border-color:#754b26}.sum.green{border-color:#1c735c}.guide{margin:15px 0 20px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:13px}.guide b{color:var(--text)}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;align-items:start}.lane{border:1px solid var(--line);border-radius:17px;background:#091725;overflow:hidden}.lanehead{padding:15px;border-bottom:1px solid var(--line)}.lanehead h2{font-size:19px;margin:0 0 4px}.lanehead p{margin:0;color:var(--muted);font-size:12px}.lane.yellow .lanehead{background:#302916}.lane.orange .lanehead{background:#352314}.lane.green .lanehead{background:#0e3029}.cards{padding:9px}.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.card:last-child{margin-bottom:0}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.symbol{font-size:20px;font-weight:900}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;white-space:nowrap}.yellow .badge{background:#4b401d;color:var(--yellow)}.orange .badge{background:#54331b;color:var(--orange)}.green .badge{background:#123f34;color:var(--green)}.price{font-size:12px;color:var(--muted);margin:4px 0 10px}.reasons{display:grid;gap:6px}.reason{font-size:13px;padding-left:18px;position:relative}.reason:before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.actions a{text-decoration:none;text-align:center;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:9px;font-size:12px;font-weight:800}.actions a:last-child{color:var(--blue);border-color:#356281}details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:800}.tech{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;font-size:11px;color:var(--muted)}.tech b{display:block;color:var(--text);font-size:12px}.footerDetails{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.footerDetails summary{font-size:14px}.rankrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.rankrow:first-child{margin-top:10px}.rankrow b{color:var(--yellow)}@media(max-width:850px){.lanes{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:480px){h1{font-size:23px}.summary{gap:6px}.sum{padding:11px 8px}.sum b{font-size:23px}.sum span{font-size:11px}.actions{grid-template-columns:1fr}.wrap{padding:15px 10px 50px}}
</style></head><body><main class="wrap">
<header><div><div class="status"><span id="dot" class="dot"></span><span id="connection">연결 확인 중</span></div><h1>BES 3단계 검색기</h1><div class="desc">미리 관찰 → 상승 준비 → 소액 검토 순서로 확인하세요.</div></div><button id="alarm" class="alarm">알림 켜기</button></header>
<section class="summary"><div class="sum yellow"><span>🟡 미리 관찰</span><b id="yellowCount">-</b></div><div class="sum orange"><span>🟠 상승 준비</span><b id="orangeCount">-</b></div><div class="sum green"><span>🟢 소액 검토</span><b id="greenCount">-</b></div></section>
<div id="updated" class="updated"></div><div class="guide"><b>보는 방법:</b> 초록색부터 확인하고, 주황색은 돌파 여부를 관찰하세요. 노란색은 아직 바닥을 만드는 단계입니다. 자동매수 신호는 아닙니다.</div>
<section class="lanes"><div class="lane green"><div class="lanehead"><h2>🟢 소액 검토</h2><p>CONFIRM과 새 수급까지 확인</p></div><div id="greenCards" class="cards"></div></div><div class="lane orange"><div class="lanehead"><h2>🟠 상승 준비</h2><p>돌파 또는 CONFIRM 재확인 대기</p></div><div id="orangeCards" class="cards"></div></div><div class="lane yellow"><div class="lanehead"><h2>🟡 미리 관찰</h2><p>바닥을 만들 가능성이 있는 종목</p></div><div id="yellowCards" class="cards"></div></div></section>
<details class="footerDetails"><summary>수급 발생 TOP 5와 전체 감시 정보 보기</summary><div id="extraInfo"></div></details>
</main><script>
const fmt=n=>n==null?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:8});
const links=s=>({bithumb:`https://www.bithumb.com/trade/order/${encodeURIComponent(s)}_KRW`,tv:`https://www.tradingview.com/chart/?symbol=BITHUMB%3A${encodeURIComponent(s)}KRW`});
const easyReasons=x=>{const raw=`${x.radar_reason||''}·${x.entry_review_reason||''}·${x.decision_reason||''}`;const map=[['저점 방어','바닥을 다시 지켰어요'],['재시험 거래량 감소','내려갈 때 거래량이 줄었어요'],['OBV 선행','매수세가 가격보다 먼저 움직여요'],['20EMA 회복','중요 평균가격을 회복했어요'],['직전 고점 접근','이전 고점 돌파를 준비 중이에요'],['거래량 재유입','거래량이 다시 들어오고 있어요'],['CONFIRM','CONFIRM 가격을 다시 확인 중이에요'],['2차 수급','수급이 두 번째로 들어왔어요']];const out=[];for(const [key,text] of map)if(raw.includes(key)&&!out.includes(text))out.push(text);if(!out.length)out.push(x.radar_stage?'바닥 구조 조건을 확인하고 있어요':'새 수급을 기다리고 있어요');return out.slice(0,3)};
const card=(x,color)=>{const u=links(x.symbol),label=color==='green'?(x.entry_cycle_state||'소액 검토'):color==='orange'?(x.radar_stage==='돌파 준비'?'돌파 준비':'상승 준비'):(x.radar_stage||'미리 관찰');return `<article class="card"><div class="cardtop"><div class="symbol">${x.symbol}</div><span class="badge">${label}</span></div><div class="price">현재가 ${fmt(x.current_price)}</div><div class="reasons">${easyReasons(x).map(r=>`<div class="reason">${r}</div>`).join('')}</div><div class="actions"><a href="${u.bithumb}" target="_blank" rel="noopener">빗썸 차트</a><a href="${u.tv}" target="_blank" rel="noopener">트레이딩뷰</a></div><details><summary>상세 숫자 보기</summary><div class="tech"><div>조기점수<b>${fmt(x.radar_score)}점</b></div><div>첫/둘째 바닥<b>${fmt(x.radar_l1_price)} / ${fmt(x.radar_l2_price)}</b></div><div>CONFIRM<b>${fmt(x.confirm_price)}</b></div><div>손절 기준<b>${fmt(x.entry_stop_price||x.decision_stop_price)}</b></div><div>1차/2차 수급<b>${fmt(x.flow_first_strength)} / ${fmt(x.flow_second_strength)}</b></div><div>최고/MAE<b>${fmt(x.peak_return)}% / ${fmt(x.mae)}%</b></div></div></details></article>`};
const render=(el,rows,color,msg)=>el.innerHTML=rows.length?rows.slice(0,12).map(x=>card(x,color)).join(''):`<div class="empty">${msg}</div>`;
let known=new Set(),initialized=false;alarm.onclick=async()=>{if(!('Notification'in window)){alarm.textContent='알림 미지원';return}const p=await Notification.requestPermission();alarm.textContent=p==='granted'?'알림 켜짐':'알림 차단됨'};
async function load(){try{const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());dot.classList.toggle('on',d.connected);connection.textContent=d.connected?'빗썸 실시간 연결':'연결 끊김';updated.textContent=d.updated_at_ms?`마지막 반영 ${new Date(d.updated_at_ms).toLocaleTimeString()} · 전체 ${d.market_count}종목 감시 · BTC ${d.btc_market?.state||'확인 중'}`:'데이터 준비 중';const all=d.results||[],green=all.filter(x=>x.entry_review),greenSet=new Set(green.map(x=>x.market));const orange=all.filter(x=>!greenSet.has(x.market)&&(x.radar_stage==='돌파 준비'||x.entry_cycle_state==='CONFIRM 재확인 대기'||x.entry_cycle_state==='재진입')),orangeSet=new Set(orange.map(x=>x.market));const yellow=all.filter(x=>!greenSet.has(x.market)&&!orangeSet.has(x.market)&&['바닥 준비 관찰','A 초기 후보'].includes(x.radar_stage));yellowCount.textContent=yellow.length;orangeCount.textContent=orange.length;greenCount.textContent=green.length;render(greenCards,green,'green','지금은 최종 조건을 통과한 종목이 없습니다.');render(orangeCards,orange,'orange','현재 돌파를 준비하는 종목이 없습니다.');render(yellowCards,yellow,'yellow','현재 바닥 준비 후보가 없습니다.');const nowGreen=new Set(green.map(x=>x.market));if(initialized&&'Notification'in window&&Notification.permission==='granted')green.filter(x=>!known.has(x.market)).forEach(x=>new Notification(`BES 소액 검토: ${x.symbol}`,{body:easyReasons(x).join(' · ')}));known=nowGreen;initialized=true;const period=d.counting_window,top=d.top_detection_counts||[];extraInfo.innerHTML=`<div class="updated" style="margin-top:10px">${period?`${new Date(period.start_at_ms).toLocaleString()} ~ ${new Date(period.end_at_ms).toLocaleString()}`:''}<br>기존 수급 ${d.champion_count} · A+수급 ${d.challenger_count}</div>${top.map(x=>`<div class="rankrow"><span><b>${x.rank}위 ${x.symbol}</b><br><small>${x.price_trend}</small></span><strong>${x.count}회</strong></div>`).join('')||'<div class="empty">아직 재포착 기록이 없습니다.</div>'}`}catch(e){connection.textContent='데이터 연결 오류'}}setInterval(load,1500);load();
</script></body></html>
