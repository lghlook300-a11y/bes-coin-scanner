<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BES 실시간 수급 검색기</title>
  <style>
    :root{color-scheme:dark;--bg:#06111d;--card:#0d1b2b;--line:#1e3850;--green:#39e6b0;--amber:#ffbd57;--red:#ff6b75;--blue:#73c7ff;--text:#eff7ff;--muted:#8ca1b7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}h1{font-size:25px;margin:6px 0}.sub{color:var(--muted);font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.box,.coin{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.box b{display:block;font-size:23px;margin-top:5px}.status{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green)}.coin{margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.symbol{font-size:22px;font-weight:800}.badge{padding:6px 9px;border-radius:9px;background:#17324a;text-align:right;font-size:14px}.rise{color:var(--green)}.flow{color:var(--blue)}.hot{color:var(--amber)}.exit{color:var(--red)}.chart{height:86px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#081522;padding:6px}.chart svg{width:100%;height:100%;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;font-size:13px}.grid span{color:var(--muted);display:block;margin-bottom:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions a{text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;font-weight:700}.actions a:first-child{border-color:#1d755d;color:var(--green)}.empty{text-align:center;color:var(--muted);padding:50px 10px}.notice{margin:12px 0;color:var(--muted);font-size:12px}@media(max-width:450px){.summary{grid-template-columns:1fr 1fr}.summary .box:first-child{grid-column:1/-1}}
  </style>
</head>
<body><main class="wrap">
  <div class="status"><span id="dot" class="dot"></span><span id="connection">연결 확인 중</span></div>
  <h1>실시간 수급 검색기</h1><div class="sub">순간값이 아니라 지속된 체결·호가 변화를 확정합니다.</div>
  <section class="summary"><div class="box">전체 종목<b id="markets">-</b></div><div class="box">수급 유입<b id="inflow">-</b></div><div class="box">상승 가능<b id="rising">-</b></div></section>
  <div id="updated" class="sub"></div><div class="notice">상승 가능은 15초 유지 후 확정됩니다. 과열·수급 이탈은 빠르게 반영됩니다.</div><section id="list"></section>
</main><script>
const fmt=n=>n==null?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:8});
const cls=s=>s==='상승 가능'?'rise':s==='수급 유입'?'flow':s.includes('과열')?'hot':s.includes('이탈')?'exit':'';
const spark=(points,state)=>{if(!points||points.length<2)return '<div class="empty" style="padding:28px">3분 차트 준비 중</div>';const ps=points.map(p=>Number(p[1])),lo=Math.min(...ps),hi=Math.max(...ps),range=hi-lo||1,w=300,h=70,pad=4;const path=ps.map((p,i)=>`${i?'L':'M'}${pad+i*(w-pad*2)/(ps.length-1)},${h-pad-(p-lo)*(h-pad*2)/range}`).join(' ');const color=state==='상승 가능'?'#39e6b0':state.includes('과열')?'#ffbd57':state.includes('이탈')?'#ff6b75':'#73c7ff';return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="최근 3분 가격"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`};
const links=s=>({bithumb:`https://www.bithumb.com/trade/order/${encodeURIComponent(s)}_KRW`,tv:`https://www.tradingview.com/chart/?symbol=BITHUMB%3A${encodeURIComponent(s)}KRW`});
async function load(){try{const d=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());
 document.querySelector('#dot').classList.toggle('on',d.connected);document.querySelector('#connection').textContent=d.connected?'빗썸 실시간 연결':'연결 끊김';
 markets.textContent=d.market_count;inflow.textContent=d.inflow_count;rising.textContent=d.rising_count;updated.textContent=d.updated_at_ms?'마지막 반영 '+new Date(d.updated_at_ms).toLocaleTimeString():'데이터 준비 중';
 list.innerHTML=d.results.length?d.results.map(x=>{const u=links(x.symbol);return `<article class="coin"><div class="top"><div><div class="symbol">${x.symbol}</div><div class="sub">${x.market}</div></div><b class="badge ${cls(x.state)}">${x.state} · ${x.score}점<br><small>${x.confirmed_for_seconds}초 유지</small></b></div><div class="chart">${spark(x.chart_prices,x.state)}</div><div class="grid"><div><span>현재가</span>${fmt(x.current_price)}</div><div><span>최초 포착가</span>${fmt(x.first_seen_price)}</div><div><span>30초 / 1분 수급</span>${x.flow_30s}배 / ${x.flow_1m}배</div><div><span>30초 / 1분 매수체결</span>${x.buy_ratio_30s}% / ${x.buy_ratio_1m}%</div><div><span>호가 매수 비중</span>${x.orderbook_buy_ratio}%</div><div><span>포착 후 현재</span>${fmt(x.return_since_first)}%</div><div><span>최고 / MAE</span>${fmt(x.peak_return)}% / ${fmt(x.mae)}%</div></div><div class="actions"><a href="${u.bithumb}" target="_blank" rel="noopener">빗썸 차트</a><a href="${u.tv}" target="_blank" rel="noopener">트레이딩뷰</a></div></article>`}).join(''):'<div class="empty">현재 확정된 수급 변화 종목이 없습니다.</div>';
}catch(e){document.querySelector('#connection').textContent='데이터 연결 오류'}}setInterval(load,1000);load();
</script></body></html>
